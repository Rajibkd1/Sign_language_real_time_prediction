name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      ENABLE_HISTORY: "false"
      SAVE_INFERENCE_ARTIFACTS: "false"
    steps:
      - uses: actions/checkout@v4
      - name: Install MediaPipe native libraries
        run: |
          sudo apt-get update
          sudo apt-get install --yes libegl1 libgl1 libgles2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install CPU backend dependencies
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r backend/requirements.txt
      - name: Test backend and evaluation scoring
        run: python -m pytest backend/tests -q
      - name: Benchmark bundled checkpoint with synthetic input
        run: python backend/scripts/benchmark_model.py --frames 128 384 --warmup 5 --runs 30 --threads 1 --output evaluation-results/model6-latency.json
      - name: Preserve synthetic benchmark evidence
        uses: actions/upload-artifact@v4
        with:
          name: model6-synthetic-latency
          path: evaluation-results/model6-latency.json
          retention-days: 14

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  code-prerelease:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build code-only prerelease after verification
        run: python backend/scripts/build_code_release.py --version 0.1.0-rc.1 --output release-artifacts --ci-run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      - name: Verify the packaged source without model binaries
        run: |
          python -m pip install "pytest>=8.2.0"
          python -c "import zipfile; zipfile.ZipFile('release-artifacts/BdSL-Vision-0.1.0-rc.1-source.zip').extractall('release-artifacts/smoke')"
          python -m pytest release-artifacts/smoke/BdSL-Vision-0.1.0-rc.1/backend/tests/test_evaluation.py release-artifacts/smoke/BdSL-Vision-0.1.0-rc.1/backend/tests/test_evaluation_runner.py release-artifacts/smoke/BdSL-Vision-0.1.0-rc.1/backend/tests/test_prepare_video_evaluation.py release-artifacts/smoke/BdSL-Vision-0.1.0-rc.1/backend/tests/test_asset_download.py release-artifacts/smoke/BdSL-Vision-0.1.0-rc.1/backend/tests/test_code_release.py -q -k "not bundled"
      - uses: actions/upload-artifact@v4
        with:
          name: bdsl-code-prerelease
          path: |
            release-artifacts/*-source.zip
            release-artifacts/RELEASE_MANIFEST.json
            release-artifacts/SHA256SUMS
          retention-days: 14
